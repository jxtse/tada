name: Agent runtime contracts
on: [push, pull_request]
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: uv sync
      - run: npm ci
      - run: uv run python -m tada_runtime.schemas --check
      - run: npm run schemas:check
      - run: npm run build
      - run: npm test
      - run: uv run pytest -q
