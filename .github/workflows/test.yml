name: Offline tests
on: [push, pull_request]
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: uv sync
      - run: npm ci
      - run: uv run python -m tada_runtime.schemas --check
      - run: npm run schemas:check
      - run: npm run build
      - run: npm test
      - run: uv run pytest -q
  taskgen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark/taskgen
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --project v5 --locked
      - run: uv pip install --python v5/.venv/bin/python openpyxl PyYAML python-dateutil
      - run: v5/.venv/bin/python -c "import sys; sys.path[:0]=['.','v5']; import tada_taskgen"
      - run: uv run --project v5 --no-sync pytest v5/tests -q -rs -p no:cacheprovider
